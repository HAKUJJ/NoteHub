<!DOCTYPE html>
<html lang="en">
<!-- https://www.borntodev.com/2024/04/25/การทำ-Form-Validation-ด้วย-JavaScript/ -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        * {
            font-family: "Kanit", sans-serif;
            box-sizing: border-box;
        }

        body {
            background-color: #3f3f3f;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background-color: rgb(255, 255, 255);
            border-radius: 5px;
            width: 400px;
        }

        .form {
            padding: 30px 50px;
        }

        .form-control {
            position: relative;
            margin-bottom: 10px;
            padding-bottom: 20px;
        }

        .form-control label {
            display: block;
            font-weight: 600;
            color: gray;
            margin-bottom: 10px;
        }

        .form-control input {
            border-radius: 5px;
            display: block;
            width: 100%;
            padding: 10px;
        }

        .form button {
            cursor: pointer;
        }

        .form-control.error input {
            border-color: red;
        }

        .form-control.success input {
            border-color: green;
        }

        .form-control small {
            color: red;
            position: absolute;
            bottom: 0;
            left: 0;
            visibility: hidden;
        }

        .form-control.error small {
            visibility: visible;
        }
    </style>
</head>

<body>
    <div class="container">

        <form class="form" id="form">
            <h1>แบบฟอร์มลงทะเบียน</h1>
            <div class="form-control">
                <label for="username">ชื่อผู้ใช้</label>
                <input type="text" name="" id="username" placeholder="กรอก username">
                <small>error message</small>
            </div>
            <div class="form-control">
                <label for="email">อีเมล</label>
                <input type="email" name="" id="email" placeholder="กรอก email">
                <small>error message</small>
            </div>
            <div class="form-control">
                <label for="password">รหัสผ่าน</label>
                <input type="password" name="" id="password" placeholder="กรอก password">
                <small>error message</small>
            </div>
            <div class="form-control">
                <label for="password">ยืนยันรหัสผ่าน</label>
                <input type="password" name="" id="checkpassword" placeholder="กรอก password อีกครั้ง">
                <small>error message</small>
            </div>
            <button type="submit">ยืนยันข้อมูล</button>
        </form>

    </div>
    <script>
        const form = document.getElementById('form');
        const username = document.getElementById('username');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const checkpassword = document.getElementById('checkpassword');

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            if (username.value === '') {
                showError(username, 'กรุณากรอก username');
            } else {
                showSuccess(username);
            }
            if (email.value === '') {
                showError(email, 'กรุณากรอก email');
            } else {
                showSuccess(email);
            }
            if (password.value === '') {
                showError(password, 'กรุณากรอก password');
            } else {
                showSuccess(password);
            }
            if (checkpassword.value === '') {
                showError(checkpassword, 'กรุณากรอก password');
            } else {
                showSuccess(checkpassword);
            }
            checkInputLength(username, 5, 20);
        });
        function checkInputLength(input, min, max) {
            if (input.value.length <= min) {
                showError(input, `ข้อมูลที่กรอกต้องยาวกว่า ${min} ตัวอักษร`)
            } else if (input.value.length > max) {
                showError(input, `ข้อมูลที่กรอกต้องไม่ยาวกว่า ${max} ตัวอักษร`)
            } else {
                showSuccess(input);
            }
        }
        function showError(input, message) {
            const formControl = input.parentElement;
            formControl.className = 'form-control error';
            const small = formControl.querySelector('small');
            small.innerText = message;
        }

        function showSuccess(input) {
            const formControl = input.parentElement;
            formControl.className = 'form-control success';
        }
    </script>
</body>

</html>
