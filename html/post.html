<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="สร้างโพสต์แบ่งปันสรุปเนื้อหาหรือข้อสอบเก่าของคุณให้เพื่อน ๆ บน NotesHub" />
  <title>สร้างโพสต์ - NotesHub</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ========== Navbar ========== -->
  <header class="navbar">
    <div class="navbar-brand">
      <img src="images/logo.svg" alt="โลโก้ NotesHub" width="36" height="36" />
      <span>NotesHub</span>
    </div>
    <nav class="navbar-links">
      <a href="index.html">หน้าแรก</a>
      <a href="post.html" class="active">สร้างโพสต์</a>
      <a href="matcher.html">Matcher</a>
      <a href="about.html">เกี่ยวกับเรา</a>
    </nav>
    <button class="menu-toggle" id="menuToggle" aria-label="เปิดเมนู">&#9776;</button>
    <div class="navbar-actions">
      <button class="btn btn-outline" id="loginBtn">เข้าสู่ระบบ</button>
      <button class="btn btn-primary" id="registerBtn">สมัครสมาชิก</button>
    </div>
  </header>

  <main class="post-page">
    <section class="post-hero">
      <h1>สร้างโพสต์ใหม่</h1>
      <p>แบ่งปันสรุปเนื้อหาหรือข้อสอบเก่าของคุณให้เพื่อน ๆ ได้ใช้ประโยชน์</p>
    </section>

    <form id="postForm" class="post-form" novalidate>
      <div class="field">
        <label for="postTitle">ชื่อโน้ต</label>
        <input type="text" id="postTitle" name="title" required placeholder="เช่น สรุปคณิตศาสตร์ ม.4"
          data-error-message="กรุณากรอกชื่อโน้ต" />
        <p class="error-message" id="postTitle-error"></p>
      </div>

      <div class="field">
        <label for="postSubject">รายวิชา</label>
        <input type="text" id="postSubject" name="subject" required placeholder="เช่น คณิตศาสตร์เพิ่มเติม"
          data-error-message="กรุณากรอกชื่อวิชา" />
        <p class="error-message" id="postSubject-error"></p>
      </div>

      <div class="post-form-grid">
        <div class="field">
          <label for="postFaculty">หมวดวิชา</label>
          <select id="postFaculty" name="faculty" required data-error-message="กรุณาเลือกหมวดวิชา">
            <option value="">-- เลือกหมวดวิชา --</option>
            <option value="math">คณิตศาสตร์</option>
            <option value="science">วิทยาศาสตร์</option>
            <option value="english">ภาษาอังกฤษ</option>
            <option value="thai">ภาษาไทย</option>
            <option value="social">สังคมศึกษา</option>
          </select>
          <p class="error-message" id="postFaculty-error"></p>
        </div>

        <div class="field">
          <label for="postYear">ระดับชั้น</label>
          <select id="postYear" name="year" required data-error-message="กรุณาเลือกระดับชั้น">
            <option value="">-- เลือกระดับชั้น --</option>
            <option value="m1">ม.1</option>
            <option value="m2">ม.2</option>
            <option value="m3">ม.3</option>
            <option value="m4">ม.4</option>
            <option value="m5">ม.5</option>
            <option value="m6">ม.6</option>
          </select>
          <p class="error-message" id="postYear-error"></p>
        </div>

        <div class="field">
          <label for="postType">ประเภท</label>
          <select id="postType" name="type" required data-error-message="กรุณาเลือกประเภท">
            <option value="">-- เลือกประเภท --</option>
            <option value="note">สรุปเนื้อหา</option>
            <option value="exam">ข้อสอบเก่า</option>
          </select>
          <p class="error-message" id="postType-error"></p>
        </div>
      </div>

      <div class="field">
        <label for="postAuthor">โพสต์โดย</label>
        <input type="text" id="postAuthor" name="author" required placeholder="ชื่อ-นามสกุล หรือชื่อเล่น"
          data-error-message="กรุณากรอกชื่อผู้โพสต์" />
        <p class="error-message" id="postAuthor-error"></p>
      </div>

      <div class="field">
        <label for="postDescription">รายละเอียดเพิ่มเติม</label>
        <textarea id="postDescription" name="description" rows="4"
          placeholder="อธิบายเนื้อหาโดยสังเขป (ไม่บังคับ)"></textarea>
      </div>

      <div class="field">
        <label for="postFile">แนบไฟล์เอกสาร</label>
        <input type="file" id="postFile" name="file" accept=".pdf,.doc,.docx,.png,.jpg" />
      </div>

      <button type="submit" class="btn btn-primary btn-block">เผยแพร่โพสต์</button>
      <p class="form-status" id="postStatus"></p>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 NotesHub.Mini Project</p>
  </footer>

  <!-- ========== Modal: Login / Register ========== -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="loginModal">
      <button class="modal-close" aria-label="ปิดหน้าต่าง">&times;</button>
      <h2>เข้าสู่ระบบ</h2>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginEmail">อีเมล</label>
          <input type="email" id="loginEmail" name="email" required data-error-message="กรุณากรอกอีเมลให้ถูกต้อง" />
          <p class="error-message" id="loginEmail-error"></p>
        </div>
        <div class="field">
          <label for="loginPassword">รหัสผ่าน</label>
          <input type="password" id="loginPassword" name="password" required minlength="8"
            data-error-message="รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร" />
          <p class="error-message" id="loginPassword-error"></p>
        </div>
        <button type="submit" class="btn btn-primary btn-block">เข้าสู่ระบบ</button>
        <p class="form-status" id="loginStatus"></p>
      </form>
      <p class="modal-switch">ยังไม่มีบัญชี? <button type="button" id="showRegister">สมัครสมาชิก</button></p>
    </div>

    <div class="modal" id="registerModal" hidden>
      <button class="modal-close" aria-label="ปิดหน้าต่าง">&times;</button>
      <h2>สมัครสมาชิก</h2>
      <form id="registerForm" novalidate>
        <div class="field">
          <label for="registerName">ชื่อ-นามสกุล</label>
          <input type="text" id="registerName" name="fullName" required data-error-message="กรุณากรอกชื่อ-นามสกุล" />
          <p class="error-message" id="registerName-error"></p>
        </div>
        <div class="field">
          <label for="registerEmail">อีเมล</label>
          <input type="email" id="registerEmail" name="email" required data-error-message="กรุณากรอกอีเมลให้ถูกต้อง" />
          <p class="error-message" id="registerEmail-error"></p>
        </div>
        <div class="field">
          <label for="registerPassword">รหัสผ่าน</label>
          <input type="password" id="registerPassword" name="password" required minlength="8"
            data-error-message="รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร" />
          <p class="error-message" id="registerPassword-error"></p>
        </div>
        <div class="field">
          <label for="registerConfirmPassword">ยืนยันรหัสผ่าน</label>
          <input type="password" id="registerConfirmPassword" name="confirmPassword" required
            data-error-message="กรุณายืนยันรหัสผ่านให้ตรงกัน" />
          <p class="error-message" id="registerConfirmPassword-error"></p>
        </div>
        <button type="submit" class="btn btn-secondary btn-block">สมัครสมาชิก</button>
        <p class="form-status" id="registerStatus"></p>
      </form>
      <p class="modal-switch">มีบัญชีอยู่แล้ว? <button type="button" id="showLogin">เข้าสู่ระบบ</button></p>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/post.js"></script>
</body>
</html>
