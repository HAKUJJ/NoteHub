<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A simple accessible contact form example.">
    <title>Contact Form | HTML Practice</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page-shell">
        <header class="page-header">
            <p class="eyebrow">HTML practice</p>
            <h1>Contact us</h1>
            <p>A small example using labels, native input types, and browser validation.</p>
        </header>

        <form class="registration-card" action="#" method="post">
            <div class="form-grid">
                <div class="field">
                    <label for="first-name">First name <span aria-hidden="true">*</span></label>
                    <input type="text" id="first-name" name="firstName" autocomplete="given-name" required>
                </div>
                <div class="field">
                    <label for="last-name">Last name <span aria-hidden="true">*</span></label>
                    <input type="text" id="last-name" name="lastName" autocomplete="family-name" required>
                </div>
                <div class="field field-wide">
                    <label for="email">Email <span aria-hidden="true">*</span></label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="field field-wide">
                    <label for="country">Country <span aria-hidden="true">*</span></label>
                    <select id="country" name="country" required>
                        <option value="">Choose a country</option>
                        <option value="TH">Thailand</option>
                        <option value="AU">Australia</option>
                        <option value="CA">Canada</option>
                        <option value="US">USA</option>
                    </select>
                </div>
                <div class="field field-wide">
                    <label for="message">Message <span aria-hidden="true">*</span></label>
                    <textarea id="message" name="message" rows="6" maxlength="500" required></textarea>
                </div>
            </div>

            <div class="form-footer">
                <p class="required-note"><span aria-hidden="true">*</span> Required fields</p>
                <button type="submit">Send message</button>
            </div>
        </form>
    </main>
</body>

</html>
