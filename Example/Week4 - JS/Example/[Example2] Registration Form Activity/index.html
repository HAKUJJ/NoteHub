<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A registration form example for learning HTML, CSS, and JavaScript validation.">
    <title>Student Registration | Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page-shell">
        <header class="page-header">
            <p class="eyebrow">HTML • CSS • JavaScript</p>
            <h1>Student registration</h1>
            <p>Practice native form controls, accessible errors, and client-side validation.</p>
        </header>

        <form id="registration-form" class="registration-card" novalidate>
            <div class="form-grid">
                <div class="field">
                    <label for="username">Username <span aria-hidden="true">*</span></label>
                    <input type="text" id="username" name="username" autocomplete="username" minlength="5"
                        maxlength="12" required aria-describedby="username-error">
                    <p class="error-message" id="username-error"></p>
                </div>
                <div class="field">
                    <label for="password">Password <span aria-hidden="true">*</span></label>
                    <input type="password" id="password" name="password" autocomplete="new-password" minlength="8"
                        required aria-describedby="password-error">
                    <p class="error-message" id="password-error"></p>
                </div>
                <div class="field">
                    <label for="first-name">First name <span aria-hidden="true">*</span></label>
                    <input type="text" id="first-name" name="firstName" autocomplete="given-name" required
                        aria-describedby="first-name-error">
                    <p class="error-message" id="first-name-error"></p>
                </div>
                <div class="field">
                    <label for="last-name">Last name <span aria-hidden="true">*</span></label>
                    <input type="text" id="last-name" name="lastName" autocomplete="family-name" required
                        aria-describedby="last-name-error">
                    <p class="error-message" id="last-name-error"></p>
                </div>
                <div class="field field-wide">
                    <label for="email">Email <span aria-hidden="true">*</span></label>
                    <input type="email" id="email" name="email" autocomplete="email" required
                        aria-describedby="email-error">
                    <p class="error-message" id="email-error"></p>
                </div>
                <div class="field field-wide">
                    <label for="address">Address <span aria-hidden="true">*</span></label>
                    <input type="text" id="address" name="address" autocomplete="street-address" required
                        aria-describedby="address-error">
                    <p class="error-message" id="address-error"></p>
                </div>
                <div class="field">
                    <label for="country">Country <span aria-hidden="true">*</span></label>
                    <select id="country" name="country" required aria-describedby="country-error">
                        <option value="">Choose a country</option>
                        <option value="TH">Thailand</option>
                        <option value="AU">Australia</option>
                        <option value="CA">Canada</option>
                        <option value="US">USA</option>
                    </select>
                    <p class="error-message" id="country-error"></p>
                </div>
                <div class="field">
                    <label for="zip">ZIP code <span aria-hidden="true">*</span></label>
                    <input type="text" id="zip" name="zip" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required
                        aria-describedby="zip-error">
                    <p class="error-message" id="zip-error"></p>
                </div>
            </div>

            <fieldset>
                <legend>Preferred language <span aria-hidden="true">*</span></legend>
                <div class="option-row">
                    <label><input type="checkbox" name="language" value="en" required> English</label>
                    <label><input type="checkbox" name="language" value="th"> Thai</label>
                </div>
                <p class="error-message" id="language-error"></p>
            </fieldset>

            <fieldset>
                <legend>Gender <span aria-hidden="true">*</span></legend>
                <div class="option-row">
                    <label><input type="radio" name="gender" value="male" required> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                    <label><input type="radio" name="gender" value="other"> Other</label>
                </div>
                <p class="error-message" id="gender-error"></p>
            </fieldset>

            <div class="field">
                <label for="note">Note <span class="optional">(optional)</span></label>
                <textarea id="note" name="note" rows="4" maxlength="300"
                    placeholder="Tell us something about yourself..."></textarea>
            </div>

            <div class="form-footer">
                <p class="required-note"><span aria-hidden="true">*</span> Required fields</p>
                <button type="submit">Create account</button>
            </div>
            <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
    </main>
    <script src="form_validation.js"></script>
</body>

</html>
